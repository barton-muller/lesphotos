<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>lesphotos setup: a phone or laptop talks to a server that reads plain photo folders</title>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b64c8"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2570c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3a7a1c"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a2a27"/></marker>
  </defs>
  <rect x="1" y="1" width="1098" height="558" rx="16" fill="#fbfaf6" stroke="#d6d3c6" stroke-width="2"/>

  <!-- client -->
  <rect x="40" y="40" width="340" height="480" rx="16" fill="#ffffff" stroke="#2a2a27" stroke-width="2"/>
  <rect x="62" y="62" width="38" height="30" rx="5" fill="none" stroke="#1d1d1b" stroke-width="2.5"/>
  <line x1="62" y1="72" x2="100" y2="72" stroke="#1d1d1b" stroke-width="2.5"/>
  <text x="114" y="78" font-size="21" font-weight="700" fill="#1d1d1b">Phone or laptop</text>
  <text x="114" y="99" font-size="14" fill="#4a4943">installable web app (PWA)</text>

  <rect x="62" y="128" width="296" height="176" rx="12" fill="#f3f1e8" stroke="#2a2a27" stroke-width="1.5"/>
  <text x="80" y="154" font-size="15" font-weight="700" fill="#1d1d1b">Timeline</text>
  <g>
    <rect x="80" y="168" width="56" height="40" rx="5" fill="#c9654b"/><rect x="148" y="168" width="56" height="40" rx="5" fill="#4f86b8"/>
    <rect x="216" y="168" width="56" height="40" rx="5" fill="#d9a441"/><rect x="284" y="168" width="56" height="40" rx="5" fill="#5e8f5a"/>
    <rect x="80" y="216" width="56" height="40" rx="5" fill="#8a6fb0"/><rect x="148" y="216" width="56" height="40" rx="5" fill="#3e7f87"/>
    <rect x="216" y="216" width="56" height="40" rx="5" fill="#b85c7a"/><rect x="284" y="216" width="56" height="40" rx="5" fill="#7d8c3c"/>
  </g>
  <text x="80" y="284" font-size="13.5" fill="#4a4943">scrolls from local thumbnails</text>

  <rect x="62" y="322" width="296" height="72" rx="12" fill="#ffffff" stroke="#2a2a27" stroke-width="1.5"/>
  <text x="80" y="350" font-size="15" font-weight="700" fill="#1d1d1b">IndexedDB</text>
  <text x="80" y="372" font-size="13.5" fill="#4a4943">thumbnails cached on the device</text>

  <rect x="70" y="440" width="18" height="14" rx="3" fill="#1d1d1b"/>
  <path d="M73 440 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#1d1d1b" stroke-width="2.2"/>
  <text x="100" y="446" font-size="13.5" fill="#4a4943">Scrolling makes no network</text>
  <text x="100" y="466" font-size="13.5" fill="#4a4943">requests, so it works offline.</text>

  <!-- server -->
  <rect x="640" y="40" width="420" height="480" rx="16" fill="#ffffff" stroke="#2a2a27" stroke-width="2"/>
  <rect x="662" y="60" width="38" height="14" rx="4" fill="none" stroke="#1d1d1b" stroke-width="2.5"/>
  <rect x="662" y="80" width="38" height="14" rx="4" fill="none" stroke="#1d1d1b" stroke-width="2.5"/>
  <circle cx="691" cy="67" r="2" fill="#1d1d1b"/><circle cx="691" cy="87" r="2" fill="#1d1d1b"/>
  <text x="714" y="78" font-size="21" font-weight="700" fill="#1d1d1b">Your server</text>
  <text x="714" y="99" font-size="14" fill="#4a4943">a NAS or any Linux box</text>

  <g font-size="15" font-weight="700" fill="#1d1d1b">
    <rect x="664" y="124" width="372" height="70" rx="12" fill="#f3f1e8" stroke="#2a2a27" stroke-width="1.5"/>
    <text x="684" y="152">uvicorn + FastAPI</text>
    <rect x="664" y="220" width="372" height="70" rx="12" fill="#ffffff" stroke="#2a2a27" stroke-width="1.5"/>
    <text x="684" y="248">.lesphotos/ cache</text>
    <rect x="664" y="316" width="372" height="70" rx="12" fill="#ffffff" stroke="#2a2a27" stroke-width="1.5"/>
    <text x="684" y="344">indexer</text>
    <rect x="664" y="412" width="372" height="70" rx="12" fill="#f3f1e8" stroke="#2a2a27" stroke-width="1.5"/>
    <text x="684" y="440">Photo folders</text>
  </g>
  <g font-size="13.5" fill="#4a4943">
    <text x="684" y="174">the only always-on process, ~50 MB</text>
    <text x="684" y="270">thumbnails + SQLite, rebuildable</text>
    <text x="684" y="366">runs on demand, then exits</text>
    <text x="684" y="462">2026/2026-03-15-Skiing/ (originals, never modified)</text>
  </g>
  <g stroke="#2a2a27" stroke-width="2" marker-end="url(#ak)">
    <line x1="850" y1="220" x2="850" y2="198"/><line x1="850" y1="316" x2="850" y2="294"/><line x1="850" y1="412" x2="850" y2="390"/>
  </g>
  <g font-size="12.5" fill="#4a4943">
    <text x="862" y="212">serves</text><text x="862" y="308">writes</text><text x="862" y="404">reads</text>
  </g>

  <!-- 1: sync -->
  <text x="510" y="96" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b64c8">sync, once</text>
  <line x1="414" y1="110" x2="638" y2="110" stroke="#1b64c8" stroke-width="2.5" marker-end="url(#ab)"/>
  <circle cx="404" cy="110" r="12" fill="#1b64c8"/><text x="404" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <line x1="638" y1="160" x2="384" y2="160" stroke="#1b64c8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ab)"/>
  <text x="510" y="180" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b64c8">timeline + thumbnails</text>

  <!-- 2: open -->
  <text x="510" y="236" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c2570c">open a photo</text>
  <line x1="414" y1="250" x2="638" y2="250" stroke="#c2570c" stroke-width="2.5" marker-end="url(#ao)"/>
  <circle cx="404" cy="250" r="12" fill="#c2570c"/><text x="404" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <line x1="638" y1="300" x2="384" y2="300" stroke="#c2570c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ao)"/>
  <text x="510" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c2570c">preview or original</text>

  <!-- 3: edit -->
  <text x="510" y="376" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a7a1c">rename, merge, star</text>
  <line x1="414" y1="390" x2="638" y2="390" stroke="#3a7a1c" stroke-width="2.5" marker-end="url(#ag)"/>
  <circle cx="404" cy="390" r="12" fill="#3a7a1c"/><text x="404" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <line x1="638" y1="440" x2="384" y2="440" stroke="#3a7a1c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ag)"/>
  <text x="510" y="460" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a7a1c">folders renamed on disk</text>
</svg>
